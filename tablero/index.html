<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tablero exploratorio de consumo eléctrico residencial">
  <title>Consumo eléctrico residencial | Big Data</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">⚡</span><div><strong>ENERGÍA</strong><small>Big Data · Residencial</small></div></div>
      <nav id="navigation" aria-label="Navegación principal">
        <button class="nav-item active" data-view="resumen"><span>▦</span> Resumen</button>
        <button class="nav-item" data-view="resstock"><span>⌂</span> ResStock</button>
        <button class="nav-item" data-view="patrones"><span>⌁</span> Patrones</button>
        <button class="nav-item" data-view="clima"><span>☁</span> Clima</button>
        <button class="nav-item" data-view="estimaciones"><span>↗</span> Estimaciones</button>
        <button class="nav-item" data-view="anomalias"><span>△</span> Anomalías</button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span id="data-status">Preparando datos…</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">PROYECTO ACADÉMICO · MVP</p><h1 id="page-title">Resumen general</h1></div>
        <div class="topbar-right"><span class="pill">Datos exploratorios</span><button id="reload" class="icon-button" title="Recargar datos">↻</button></div>
      </header>
      <section id="view-content" class="view-content" aria-live="polite"></section>
      <footer>Fuentes: EIA · ResStock/NREL · Open-Meteo/ERA5-Land <span>Prototipo local · No representa una plataforma en producción</span></footer>
    </main>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
